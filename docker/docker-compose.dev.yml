# Local development database only:  docker compose -f docker/docker-compose.dev.yml up -d
# Published on 127.0.0.1 only (never on a public interface).
name: ipt-pm-dev

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ipt_pm
      MYSQL_USER: ipt_pm
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ipt_pm_local_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ipt_pm_local_root}
    ports: ["127.0.0.1:3306:3306"]
    volumes:
      - mysql-dev:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ./mysql/dev-init.sql:/docker-entrypoint-initdb.d/10-dev.sql:ro

volumes:
  mysql-dev: {}
